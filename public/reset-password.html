<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt Lại Mật Khẩu - Smart Crossword Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card: #111827;
      --border: #1f2937;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Plus Jakarta Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .reset-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 12px; }
    h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 0.92rem; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
    .form-group { text-align: left; margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: background 0.2s;
      margin-top: 6px;
    }
    .btn:hover { background: var(--accent-hover); }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 0.88rem;
      display: none;
    }
    .message.error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #f87171; display: block; }
    .message.success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: #34d399; display: block; }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #60a5fa;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="icon">🔒</div>
    <h2>Thiết Lập Mật Khẩu Mới</h2>
    <p>Nhập mật khẩu mới của bạn bên dưới. Mã liên kết chỉ có hiệu lực trong vòng 15 phút.</p>

    <div id="msgBox" class="message"></div>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPass">Mật khẩu mới (tối thiểu 6 ký tự)</label>
        <input type="password" id="newPass" required placeholder="Nhập mật khẩu mới" minlength="6">
      </div>
      <div class="form-group">
        <label for="confirmPass">Xác nhận mật khẩu mới</label>
        <input type="password" id="confirmPass" required placeholder="Nhập lại mật khẩu mới" minlength="6">
      </div>
      <button type="submit" id="btnSubmit" class="btn">Cập Nhật Mật Khẩu</button>
    </form>

    <a href="/" class="back-link">⬅️ Quay lại Đăng nhập Trang chủ</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");
    const msgBox = document.getElementById("msgBox");
    const form = document.getElementById("resetForm");
    const btnSubmit = document.getElementById("btnSubmit");

    if (!token) {
      msgBox.className = "message error";
      msgBox.textContent = "Liên kết không hợp lệ hoặc thiếu mã xác thực token!";
      form.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const p1 = document.getElementById("newPass").value;
      const p2 = document.getElementById("confirmPass").value;

      if (p1 !== p2) {
        msgBox.className = "message error";
        msgBox.textContent = "Hai mật khẩu không khớp nhau!";
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = "Đang xử lý...";
      try {
        const res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, newPassword: p1 })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Lỗi đặt lại mật khẩu");

        msgBox.className = "message success";
        msgBox.textContent = data.message || "Đặt lại mật khẩu thành công!";
        form.style.display = "none";
        setTimeout(() => {
          window.location.href = "/";
        }, 2000);
      } catch (err) {
        msgBox.className = "message error";
        msgBox.textContent = err.message;
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Cập Nhật Mật Khẩu";
      }
    });
  </script>
</body>
</html>
